tter',['Unknown','Yes','No'],e.coverLetter)}${field('CV type / strategy','cvType',e.cvType,'text','placeholder="General, tailored, research…"')}${select('Exact CV version','cvId',docs('CV'),e.cvId)}</div><details><summary>More details & documents</summary><div class="fields">${select('Cover letter document','coverId',docs('Cover letter'),e.coverId)}${field('Recruiter / contact','contact',e.contact)}${field('Salary range','salary',e.salary)}${field('Employment type','employment',e.employment)}${field('Job description','description',e.description,'textarea')}${field('Notes','notes',e.notes,'textarea')}</div></details>${old?`<details open><summary>Recruitment history (${e.history.length})</summary><div class="timeline">${e.history.length?[...e.history].sort((a,b)=>b.date.localeCompare(a.date)).map(h=>`<div class="item"><div class="grow"><b>${esc(h.type)}${h.status?' · '+esc(h.status):''}</b><p class="wraptext">${esc(h.note)}</p></div><small>${fmt(h.date)}</small></div>`).join(''):empty('No dated events recorded. Imported statuses are preserved without inventing dates.')}</div><div class="actions spacer">${btn('Log activity','event',e.id)}${btn('Log response','response',e.id)}</div><p class="smalltext spacer">Save edits before opening the event form.</p></details>`:''}<div class="modal-foot">${old?btn(old.archived?'Restore':'Archive','archive',old.id):''}${old?btn('Delete','delete',old.id,'small danger'):''}${btn('Cancel','close')}<button class="primary" type="submit">Save opportunity</button></div></form>`);}

async function extractURL(){const msg=$('extractMsg');let u=M.safeURL($('extractUrl').value);if(!u){$('extractMsg').textContent='Enter a valid HTTP(S) URL.';return;}fillExtract({jobUrl:u,source:M.sourceFromURL(u)});$('extractMsg').textContent='Trying public job metadata. If blocked, paste the job description.';try{const r=await fetch(u,{credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(7000)});if(!r.ok)throw Error('HTTP '+r.status);const html=await r.text();if($('extractMsg')!==msg)return;const doc=new DOMParser().parseFromString(html,'text/html');let job;for(const script of doc.querySelectorAll('script[type="application/ld+json"]')){try{job=M.postingFromJSON(JSON.parse(script.textContent));if(job)break;}catch{}}if(!job)throw Error('No JobPosting metadata');let loc=[job.jobLocation].flat().filter(Boolean).map(x=>[x.address?.addressLocality,x.address?.addressRegion,typeof x.address?.addressCountry==='string'?x.address.addressCountry:x.address?.addressCountry?.name].filter(Boolean).join(', ')).filter(Boolean).join('; ');const desc=new DOMParser().parseFromString(String(job.description||''),'text/html').body.textContent;fillExtract({role:job.title,company:job.hiringOrganization?.name,location:loc,deadline:M.validDate(String(job.validThrough||'').slice(0,10))?String(job.validThrough).slice(0,10):'',employment:[job.employmentType].flat().filter(Boolean).join(', '),description:desc});$('extractMsg').textContent='Structured job information imported. Review the fields and add anything missing.';}catch(e){if($('extractMsg')===msg)msg.textContent='This site did not allow direct browser extraction or has no supported metadata. URL saved; paste the description or enter details manually.';}}

function platformForm(id,seed={}){let p=state.platforms.find(x=>x.id===id)||seed;dialog(id?'Edit shortcut':'Add shortcut',`<form id="platformForm" data-edit="${esc(id||'')}"><div class="fields">${field('Name *','name',p.name,'text','required')}${select('Shortcut type','type',['Platform','Saved search','Employer','Other'],p.type||'Platform')}${field('Website URL *','url',p.url,'url','required')}${field('Notes','note',p.note)}</div><div class="modal-foot">${btn('Cancel','close')}<button class="primary">Save shortcut</button></div></form>`);}
function calendar(){let all=eventRows(),today=M.today(),past=all.filter(r=>r.date<today),next=all.filter(r=>r.date>=today);return `<div class="stack"><section class="panel"><div class="panel-head"><h3>Recruitment agenda</h3>${btn('Export calendar (.ics)','ics')}</div><p class="smalltext">All-day calendar events. Import the file into your preferred calendar to set external reminders; it is not a live sync.</p></section><div class="grid2"><section class="panel"><h3>Overdue · ${past.length}</h3>${past.length?past.map(eventItem).join(''):empty('No overdue actions.')}</section><section class="panel"><h3>Upcoming · ${next.length}</h3>${next.length?next.map(eventItem).join(''):empty('No upcoming actions.')}</section></div></div>`;}
function analytics(){let all=state.entries.filter(e=>!cohort||(M.diff(M.today(),e.dateApplied)!==null&&M.diff(M.today(),e.dateApplied)>=cohort)),r=M.rates(all),g=M.group(all,groupBy), metrics=[['Response rate',pct(r.response,r.n),`${r.r} / ${r.n} applied`],['Interview rate',pct(r.interview,r.n),`${r.i} / ${r.n} applied`],['Offer rate',pct(r.offer,r.n),`${r.o} / ${r.n} applied`],['Mean recorded response time',r.avg===null?'—':r.avg.toFixed(1)+' days',`${r.timed} with known event dates`]];return `<div class="stack"><section class="panel"><div class="panel-head"><h3>Application outcomes</h3>${btn('Export statistics','exportStats')}</div><div class="toolbar"><label for="cohort">Minimum application age</label><select id="cohort"><option value="0" ${!cohort?'selected':''}>All submitted</option>${[14,30,60,90].map(x=>`<option value="${x}" ${cohort===x?'selected':''}>${x}+ days</option>`).join('')}</select></div><div class="grid2 spacer">${metrics.map(([l,v,n])=>`<div class="metric"><small>${l}</small><br><b>${v}</b><br><small>${n}</small></div>`).join('')}</div><p class="smalltext spacer">Rates use submitted applications, including archived records. A response includes rejection; interview and offer stages imply a response. Older imported statuses may lack event dates. These are descriptive rates, not causal effects.</p></section><div class="grid2"><section class="panel"><h3>Recruitment funnel</h3>${[['Submitted',r.n],['Responded',r.r],['Interviewed',r.i],['Offered',r.o]].map(([l,n])=>`<div class="row between"><span>${l}</span><b>${n}</b></div><div class="bar"><i style="width:${r.n?n/r.n*100:0}%"></i></div>`).join('')}</section><section class="panel"><h3>Last six weeks</h3>${chartWeeks(state.entries)}</section></div><section class="panel"><div class="panel-head"><h3>Compare application strategies</h3><select id="groupBy" style="width:auto" aria-label="Compare by">${[['source','Discovery source'],['category','Job category'],['cvType','CV type'],['cvId','Exact CV version'],['coverLetter','Cover letter'],['location','Location'],['language','Languages'],['employment','Employment type']].map(([k,l])=>`<option value="${k}" ${groupBy===k?'selected':''}>${l}</option>`).join('')}</select></div>${g.length?`<div class="table-wrap"><table><thead><tr><th>Group</th><th>Applied</th><th>Responses</th><th>Interviews</th><th>Offers</th><th>Interview rate</th></tr></thead><tbody>${g.map(x=>`<tr><td>${esc(groupBy==='cvId'?(state.documents.filter(d=>d.id===x.label).map(d=>d.name+(d.version?' · '+d.version:'')).at(0)||x.label):x.label)}</td><td>${x.n}</td><td>${x.r}</td><td>${x.i}</td><td>${x.o}</td><td>${pct(x.interview,x.n)}</td></tr>`).join('')}</tbody></table></div>`:empty('Submit some applications to see comparisons.')}</section></div>`;}
function settings(){let s=state.settings;return `<div class="stack"><section class="panel"><h3>Automation rules</h3><form id="settingsForm"><div class="fields">${[['follow','Follow-up suggested after'],['stale','No response after'],['dormant','Remove from active view after'],['archive','Suggest archive after'],['afterDeadline','Review after closing date'],['deadlineWarning','Deadline warning (days ahead)'],['weeklyGoal','Weekly application target']].map(([k,l])=>field(l,k,s[k],'number','min="1" max="365" required')).join('')}${field('Job categories (one per line)','categories',s.categories.join('\n'),'textarea')}${field('Discovery sources (one per line)','sources',s.sources.join('\n'),'textarea')}</div><p class="smalltext spacer">Inactivity is recalculated when the workspace opens. No response never becomes a rejection automatically. Submitted jobs remain open after their deadline.</p><div class="modal-foot"><button class="primary">Save preferences</button></div></form></section><section class="panel"><h3>Data import & export</h3><div class="actions">${btn('Import CSV or JSON','import')}${btn('Full JSON backup','backup')}${btn('Applications CSV','exportAll')}${btn('Activity history CSV','exportHistory')}</div><p class="smalltext spacer">Original tracker CSV is supported. JSON backups include settings, shortcuts, documents and event history. CSV is for analysis and does not preserve the full event history. Import JSON replaces the workspace after confirmation.</p></section>${cloudPanel()}</div>`;}
function cloudPanel(){const c=Cloud.getConfig();return `<section class="panel" id="cloudSection"><div class="panel-head"><h3>Cloud synchronization</h3>${cloudMode?tag('Active'):tag('Local')}</div>${cloudMode?`<p>Signed in as <b>${esc(cloud.session?.user?.email||'your account')}</b> · revision ${esc(cloud.revision)}</p><div class="actions spacer">${btn('Refresh from cloud','cloudRefresh')}${btn('Sign out / return to local','cloudLogout')}</div><p class="smalltext spacer">Every successful save is sent to your private workspace. Other-device changes are checked on focus and every minute when visible. Open forms and Settings are not overwritten. Concurrent changes are not silently overwritten. Cloud edits require internet; local data remains separate.</p><p class="smalltext">${cloud.rememberId?'This device is remembered. Sign out on shared devices.':'This session is not remembered after reopening.'} Workspace size: ${(Cloud.size(state)/1048576).toFixed(2)} / 5 MiB.</p>`:`<p>Sign in to your private workspace. Existing local records stay separate.</p><form id="cloudForm" class="spacer"><details ${c.url&&c.key?'':'open'}><summary>Connection settings</summary><div class="fields spacer">${field('Supabase project URL','projectUrl',c.url||'','url','required placeholder="https://your-project.supabase.co"')}${field('Publishable key','publishable',c.key||'','text','required placeholder="sb_publishable_..."')}</div></details><div class="fields spacer">${field('Account email','accountEmail','','email','required autocomplete="username"')}${field('Account password','accountPassword','','password','required autocomplete="current-password"')}<div class="checkbox full"><input id="rememberDevice" name="rememberDevice" type="checkbox" ${Cloud.canRemember()?'':'disabled'}><label for="rememberDevice">Remember this device (private devices only)</label></div></div><div class="modal-foot"><button class="primary">Connect & sign in</button></div></form><p class="smalltext spacer">Passwords are never saved by Career Ledger. Remembering a device stores authentication tokens in this browser; anyone with access to the browser may access your workspace. Sign out on shared devices. Never enter a secret/service-role key.</p>`}<p class="smalltext spacer">Backend job extraction and scheduled notifications are not yet implemented.</p></section>`;}
function updateMode(){const el=$('workspaceMode');el.innerHTML=cloudMode?`<span class="dot"></span> Cloud workspace <small>${esc(needsRefresh?'Refresh needed before saving':syncMessage||'Signed in · auto-refresh enabled')}</small>${btn('Refresh','cloudRefresh')}`:`<span class="dot"></span> Local workspace <small>Data stored on this browser</small>${btn('Cloud sign in','cloudLogin')}`;}
async function cloudConnect(data){if(busy||cloudMode)return;setBusy(true);try{await cloud.signIn(data.projectUrl,data.publishable,data.accountEmail,data.accountPassword);Cloud.remember(cloud.config);let row=await cloud.load();if(!row){const choice=prompt('No cloud workspace exists. Type LOCAL to copy this browser’s current workspace (including documents), or EMPTY to create an empty cloud workspace. Cancel to stay local.','');if(!['LOCAL','EMPTY'].includes(choice?.trim().toUpperCase())){await cloud.logout();return;}row=await cloud.create(choice.trim().toUpperCase()==='LOCAL'?state:Store.initial());}const next=Store.clean(row.payload);let rememberError='';if(data.rememberDevice){try{await cloud.rememberDevice();}catch(e){rememberError=e.message;}}else{await Cloud.forgetRemembered().catch(()=>{});}cloudMode=true;needsRefresh=false;syncMessage='';state=next;page='Overview';render();notify(rememberError?'Connected, but could not remember this device: '+rememberError:'Connected to your private cloud workspace.',!!rememberError);}catch(e){cloud.clear();notify(e.message,true);}finally{setBusy(false);}}
async function restoreSession(){if(busy||cloudMode)return;setBusy(true);try{if(!await cloud.restore())return;const row=await cloud.load();if(!row)throw Error('No existing cloud workspace. Sign in to initialize it.');state=Store.clean(row.payload);cloudMode=true;needsRefresh=false;syncMessage='';render();notify('Your cloud workspace is ready.');}catch(e){cloud.clear();notify('Could not restore your session: '+e.message,true);}finally{setBusy(false);}}
async function cloudRefresh(){if(busy||!cloudMode)return;if($('dialog').open){notify('Close the open form before refreshing.',true);return;}setBusy(true);const epoch=authEpoch;try{const row=await cloud.load();if(epoch!==authEpoch)return;if(!row)throw Error('Cloud workspace not found. Export a backup before signing out.');state=Store.clean(row.payload);needsRefresh=false;syncMessage='';render();notify('Cloud workspace refreshed.');}catch(e){if(epoch!==authEpoch)return;cloud.revision=null;needsRefresh=true;updateMode();notify(e.message+' Refresh successfully before saving again.',true);}finally{setBusy(false);}}
function safeToPoll(){return cloudMode&&!busy&&!polling&&!needsRefresh&&page!=='Settings'&&!$('dialog').open&&!document.hidden&&!document.activeElement?.matches('input,textarea,select,[contenteditable=true]');}
async function pollCloud(force=false){if(!safeToPoll()||(!force&&Date.now()-lastCheck<15000))return;polling=true;lastCheck=Date.now();const previous=state,revision=cloud.revision,session=cloud.session?.user?.id;const safe=()=>cloudMode&&!busy&&!needsRefresh&&page!=='Settings'&&!$('dialog').open&&!document.hidden&&!document.activeElement?.matches('input,textarea,select,[contenteditable=true]')&&state===previous&&cloud.revision===revision&&cloud.session?.user?.id===session;try{const meta=await cloud.peek();if(!safe())return;if(!meta)throw Error('Workspace is unavailable. Refresh manually.');if(Number(meta.revision)!==revision){const row=await cloud.read();if(!safe())return;if(!row)throw Error('Workspace is unavailable.');const next=Store.clean(row.payload);state=next;cloud.revision=Number(row.revision);syncMessage='Updated from cloud';render();}else if(syncMessage==='Connection unavailable · retrying'){syncMessage='';updateMode();}}catch(e){if(cloudMode){syncMessage=cloud.session?'Connection unavailable · retrying':'Session ended · sign in again';updateMode();}}finally{polling=false;}}
async function cloudLogout(){if(busy||!cloudMode)return;setBusy(true);let failed=false;try{await cloud.logout();}catch(e){failed=true;cloud.clear();console.warn('Remote sign-out could not be confirmed.');}finally{cloudMode=false;needsRefresh=false;syncMessage='';state=Store.load();render();notify(failed?'Returned to local workspace; remote sign-out or token removal could not be confirmed. Clear site data on shared devices.':'Returned to this browser’s separate local workspace.',failed);setBusy(false);}}
function render(){updateMode();const info=NAV.find(x=>x[0]===page);$('nav').innerHTML=NAV.map(([n,i])=>`<button class="${n===page?'active':''}" data-action="go" data-id="${n}" ${n===page?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${n}</button>`).join('');$('today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('pageTitle').textContent=page;$('subtitle').textContent=info[2];$('view').innerHTML=({'Overview':overview,'Applications':applications,'Job Search Hub':hub,'Calendar':calendar,'Analytics':analytics,'Career Toolkit':toolkit,'Settings':settings}[page])();}
function download(name,content,type='text/plain'){let u=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportApplications(a){download('applications_'+M.today()+'.csv','\uFEFF'+M.exportCSV(a,state.settings),'text/csv;charset=utf-8');}
function historyCSV(){return M.csv([['Application ID','Company','Role','Event ID','Date','Event type','Status','Note'],...state.entries.flatMap(e=>e.history.map(h=>[e.id,e.company,e.role,h.id,h.date,h.type,h.status,h.note]))]);}
function statsCSV(){let a=state.entries.filter(e=>!cohort||M.diff(M.today(),e.dateApplied)>=cohort);return M.csv([['Minimum age days','Group by','Group','Applied','Responses','Interviews','Offers','Response rate','Interview rate','Offer rate','Average response days','Dated responses'],...M.group(a,groupBy).map(x=>[cohort,groupBy,x.label,x.n,x.r,x.i,x.o,x.response,x.interview,x.offer,x.avg,x.timed])]);}
function exportICS(){const ics=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let rows=eventRows().filter(r=>r.date>=M.today());const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let output=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Career Ledger//Recruitment//EN',...rows.flatMap(r=>['BEGIN:VEVENT',`UID:${r.e.id}-${r.type}-${r.date}@career-ledger.local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${r.date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${M.addDays(r.date,1).replace(/-/g,'')}`,`SUMMARY:${ics(r.label+' — '+r.e.company)}`,`DESCRIPTION:${ics(r.e.role)}`,'END:VEVENT']),'END:VCALENDAR'];download('career_calendar.ics',output.join('\r\n')+'\r\n','text/calendar');}
function duplicate(a,b){return (a.jobUrl&&b.jobUrl&&M.safeURL(a.jobUrl)===M.safeURL(b.jobUrl))||(a.company.trim().toLowerCase()===b.company.trim().toLowerCase()&&a.role.trim().toLowerCase()===b.role.trim().toLowerCase());}
async function readData(file){return await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function openDocument(id){let d=state.documents.find(x=>x.id===id);if(!d)return;if(d.data&&/^data:(?:application\/(?:pdf|msword|vnd\.openxmlformats-officedocument\.wordprocessingml\.document|octet-stream)|text\/plain|image\/(?:png|jpeg));base64,/i.test(d.data)){let a=document.createElement('a');a.href=d.data;a.download=d.filename||d.name;document.body.append(a);a.click();a.remove();}else if(M.safeURL(d.url))window.open(M.safeURL(d.url),'_blank','noopener,noreferrer');else notify('No supported file or valid URL found.',true);}
$('newJob').onclick=()=>{if(!busy)jobForm();};$('dialog').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
document.addEventListener('click',async ev=>{let b=ev.target.closest('[data-action]');if(!b)return;let {action,id}=b.dataset;try{switch(action){case 'cloudLogin':setPage('Settings');$('cloudSection')?.scrollIntoView({block:'start'});break;case 'cloudRefresh':await cloudRefresh();break;case 'cloudLogout':await cloudLogout();break;case 'go':setPage(id);break;case 'filter':setPage('Applications',id);break;case 'new':jobForm();break;case 'edit':{let e=state.entries.find(e=>e.id===id);if(e)jobForm(e);break;}case 'close':closeDialog();break;case 'delete':await removeEntry(id);break;case 'archive':{let e=state.entries.find(e=>e.id===id);if(e&&await updateEntry({...e,archived:!e.archived},e.archived?'Opportunity restored.':'Opportunity archived.'))closeDialog();break;}case 'event':eventForm(id);break;case 'response':eventForm(id,'Response');break;case 'sort':if(sort===id)direction*=-1;else{sort=id;direction=1;}render();break;case 'direction':direction*=-1;render();break;case 'extractURL':await extractURL();break;case 'extractText':{let text=$('extractText').value.trim();if(!text){$('extractMsg').textContent='Paste some text first.';break;}fillExtract(M.extractText(text,$('extractUrl').value));$('extractMsg').textContent='Saved description and any explicitly labeled fields found. Review and complete the remaining information.';break;}case 'profile':profileForm();break;case 'copy':{let value=state.profile[id];try{await navigator.clipboard.writeText(value);notify('Copied.');}catch{prompt('Copy this value:',value);}break;}case 'doc':documentForm(id);break;case 'openDoc':openDocument(id);break;case 'deleteDoc':{let linked=state.entries.some(e=>e.cvId===id||e.coverId===id);if(linked){notify('This document is linked to an application. Keep it for history, or unlink it first.',true);break;}if(confirm('Remove this document?'))await commit({...state,documents:state.documents.filter(d=>d.id!==id)},'Document removed.');break;}case 'platform':platformForm(id);break;case 'suggest':{let [name,url]=id.split('|');platformForm('',{name,url,type:'Platform'});break;}case 'deletePlatform':if(confirm('Remove this shortcut?'))await commit({...state,platforms:state.platforms.filter(p=>p.id!==id)},'Shortcut removed.');break;case 'import':$('importFile').click();break;case 'backup':download('career_ledger_backup_'+M.today()+'.json',JSON.stringify(state,null,2),'application/json');break;case 'exportAll':exportApplications(state.entries);break;case 'exportFiltered':exportApplications(filtered());break;case 'exportHistory':download('activity_history_'+M.today()+'.csv','\uFEFF'+historyCSV(),'text/csv');break;case 'exportStats':download('application_statistics_'+M.today()+'.csv','\uFEFF'+statsCSV(),'text/csv');break;case 'ics':exportICS();break;}}catch(e){notify(e.message||'Action failed.',true);}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){search=ev.target.value;refreshTable();}});
document.addEventListener('change',ev=>{let t=ev.target;switch(t.id){case 'catFilter':category=t.value;refreshTable();break;case 'srcFilter':source=t.value;refreshTable();break;case 'sortFilter':sort=t.value;refreshTable();break;case 'cohort':cohort=Number(t.value);render();break;case 'groupBy':groupBy=t.value;render();break;case 'f_status':if(t.value==='Applied'&&!$('f_dateApplied').value)$('f_dateApplied').value=M.today();break;}});
document.addEventListener('submit',async ev=>{let f=ev.target;ev.preventDefault();let data=Object.fromEntries(new FormData(f));const done=async(next,msg)=>{if(await commit(next,msg))closeDialog();};try{switch(f.id){case 'cloudForm':f.elements.accountPassword.value='';await cloudConnect(data);break;case 'quickForm':{let u=M.safeURL($('quickUrl').value);if(!u){notify('Use an HTTP(S) job URL.',true);break;}jobForm(null,{jobUrl:u,source:M.sourceFromURL(u)});await extractURL();break;}case 'jobForm':{let old=state.entries.find(e=>e.id===f.dataset.edit);let e={...(old||M.blank()),...data};e.company=e.company.trim();e.role=e.role.trim();if(!e.company||!e.role)throw Error('Company and position are required.');for(const key of ['jobUrl','portalUrl'])if(e[key]&&!M.safeURL(e[key]))throw Error('Use a valid HTTP(S) URL.');if(e.dateApplied&&e.dateApplied>M.today())throw Error('Application date cannot be in the future.');if(e.lastActivity&&e.lastActivity>M.today())throw Error('Last activity date cannot be in the future.');if(e.status==='Applied'&&!e.dateApplied)e.dateApplied=M.today();if(!old&&state.entries.some(x=>duplicate(x,e))&&!confirm('A similar opportunity exists. Save anyway?'))break;e=M.recordChange(old,e);if(await updateEntry(e,'Opportunity saved.'))closeDialog();break;}case 'eventForm':{let e=state.entries.find(x=>x.id===f.dataset.edit);if(!M.validDate(data.date)||data.date>M.today())throw Error('Enter an event date no later than today.');let next={...e,history:[...e.history,M.event(data.type,data.date,data.note)]};if(data.type!=='Note'&&(!next.lastActivity||data.date>next.lastActivity))next.lastActivity=data.date;if(data.type==='Response'&&e.status==='Applied')next.status='In progress';if(await updateEntry(next,'Activity recorded.'))jobForm(next);break;}case 'profileForm':if(data.linkedin&&!M.safeURL(data.linkedin))throw Error('Enter a valid HTTP(S) profile URL.');await done({...state,profile:data},'Profile saved.');break;case 'platformForm':{if(!M.safeURL(data.url))throw Error('Enter a valid HTTP(S) shortcut URL.');let p={...data,id:f.dataset.edit||M.uid()};await done({...state,platforms:[...state.platforms.filter(x=>x.id!==p.id),p]},'Shortcut saved.');break;}case 'docForm':{let old=state.documents.find(x=>x.id===f.dataset.edit),file=$('docFile').files[0],d={...old,...data,id:old?.id||M.uid(),main:!!data.main&&data.type==='CV'};if(data.url&&!M.safeURL(data.url))throw Error('Enter a valid HTTP(S) document URL.');if(file){if(file.size>1.5*1024*1024)throw Error('File exceeds 1.5 MB. Use a link or a smaller file.');if(!/\.(pdf|docx?|txt|png|jpe?g)$/i.test(file.name))throw Error('Unsupported file type.');d.data=await readData(file);d.filename=file.name;}if(!d.data&&!M.safeURL(d.url))throw Error('Attach a file or add a document link.');if(old&&state.entries.some(e=>e.cvId===old.id||e.coverId===old.id)&&(file||data.url!==old.url||data.type!==old.type||data.version!==old.version)){if(!confirm('This version is linked to an application. Save changes anyway? To preserve history, cancel and add a new document.'))break;}await done({...state,documents:[...state.documents.filter(x=>x.id!==d.id).map(x=>d.main&&x.type==='CV'?{...x,main:false}:x),d]},'Document saved.');break;}case 'settingsForm':{let s={...state.settings};for(let k of ['follow','stale','dormant','archive','afterDeadline','deadlineWarning','weeklyGoal']){s[k]=Number(data[k]);if(!Number.isInteger(s[k])||s[k]<1||s[k]>365)throw Error('Enter whole numbers between 1 and 365.');}if(!(s.follow<=s.stale&&s.stale<=s.dormant&&s.dormant<=s.archive))throw Error('Thresholds must be ordered: follow-up ≤ no response ≤ dormant ≤ archive.');for(let k of ['categories','sources'])s[k]=[...new Set(data[k].split('\n').map(x=>x.trim()).filter(Boolean))];await commit({...state,settings:s},'Preferences saved.');break;}}}catch(e){if($('dialog').open){let box=$('dialogContent').querySelector('.form-error');if(!box){box=document.createElement('p');box.className='notice error form-error';f.prepend(box);}box.textContent=e.message;box.scrollIntoView({block:'nearest'});}else notify(e.message,true);}});
$('importFile').onchange=async ev=>{let file=ev.target.files[0];ev.target.value='';if(!file)return;try{let text=await file.text();if(/\.json$/i.test(file.name)){let next=Store.clean(JSON.parse(text));if(confirm(`Restore ${next.entries.length} opportunities? This replaces your current workspace, including documents and settings. Export a backup first if needed.`))await commit(next,'Backup restored.');}else{let rows=M.importCSV(text), added=[],skipped=0;for(let e of rows){if([...state.entries,...added].some(x=>duplicate(x,e))){skipped++;continue;}added.push(e);}if(!rows.length)throw Error('No valid application rows found.');if(confirm(`Import ${added.length} opportunities and skip ${skipped} possible duplicates? Existing records will not be overwritten.`))await commit({...state,entries:[...state.entries,...added]},`Imported ${added.length}; skipped ${skipped} possible duplicates.`);}}catch(e){notify('Import failed: '+e.message,true);}};
window.addEventListener('storage',ev=>{if(!cloudMode&&!busy&&ev.key===Store.KEY&&!$('dialog').open){state=Store.load();render();}});
let renderedDay=M.today();window.addEventListener('focus',()=>{if(!$('dialog').open&&renderedDay!==M.today()){renderedDay=M.today();render();}});
window.addEventListener('focus',()=>pollCloud());document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollCloud();});setInterval(()=>pollCloud(true),60000);
window.addEventListener('storage',ev=>{if(ev.key===Cloud.SESSION&&cloudMode&&cloud.rememberId){let id;try{id=JSON.parse(ev.newValue)?.id;}catch{}if(id!==cloud.rememberId){authEpoch++;closeDialog();cloud.clear();cloudMode=false;needsRefresh=false;syncMessage='';state=Store.load();render();notify('This remembered session was signed out or replaced in another tab.');}}});
render();restoreSession();if(state.loadError)notify('Existing data could not be read. Do not overwrite it until you have checked your backup.',true);

</script></body></html>
